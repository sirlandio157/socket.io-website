<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - Delivery Malalu</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#f6f8fa}
      .card{background:white;padding:2rem;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.08);width:320px}
      h2{margin:0 0 1rem 0;color:#2c3e50}
      label{display:block;margin-top:0.75rem;font-size:0.9rem}
      input{width:100%;padding:0.6rem;margin-top:0.25rem;border:1px solid #ddd;border-radius:4px}
      button{width:100%;margin-top:1rem;padding:0.6rem;background:#2d9b6a;color:#fff;border:none;border-radius:4px;cursor:pointer}
      .hint{font-size:0.85rem;color:#666;margin-top:0.5rem;text-align:center}
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Área do Gestor</h2>
      <form method="post" action="/login">
        <label>Usuário
          <input name="username" type="text" autocomplete="username" required />
        </label>
        <label>Senha
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Entrar</button>
      </form>
      <div class="hint">Use <strong>gestor</strong> / <strong>senha</strong></div>
    </div>
  </body>
</html>
